<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Redirecting…</title>
</head>
<body>
<p id="m">Redirecting…</p>
<script id="maria-links" type="application/json">{"cheeseburger-french-fry-bake":"https://dinewithlila.com/cheeseburger-french-fry-bake/","cheesy-baked-mexican-lasagna-casserole":"https://dinewithlila.com/cheesy-baked-mexican-lasagna-casserole/","cheesy-bowtie-pasta-with-savory-cajun-ground-beef-in-garlic-cream":"https://dinewithlila.com/cheesy-bowtie-pasta-with-savory-cajun-ground-beef-in-garlic-cream/","cheesy-ground-beef-and-rice-casserole":"https://dinewithlila.com/cheesy-ground-beef-and-rice-casserole/","cheesy-ground-beef-casserole-made-with-frozen-potatoes":"https://dinewithlila.com/cheesy-ground-beef-casserole-made-with-frozen-potatoes/","cheesy-potato-burritos-with-crispy-tater-tots":"https://dinewithlila.com/cheesy-potato-burritos-with-crispy-tater-tots/","cheesy-rotini-pasta-with-garlic-butter-sauce-and-ground-beef":"https://dinewithlila.com/cheesy-rotini-pasta-with-garlic-butter-sauce-and-ground-beef/","cheesy-taco-pasta-salad":"https://dinewithlila.com/cheesy-taco-pasta-salad/","classic-ground-beef-soup":"https://dinewithlila.com/classic-ground-beef-soup/","comforting-beefaroni":"https://dinewithlila.com/comforting-beefaroni/"}</script>
<script>
(function () {
  var links = JSON.parse(document.getElementById("maria-links").textContent);
  var parts = location.search.replace(/^\?/, "").split("&");
  var slug = "";
  try { slug = decodeURIComponent(parts.shift() || ""); } catch (e) {}
  slug = slug.toLowerCase().replace(/\/+$/, "");
  var to = links[slug];
  if (!to) { document.title = "Page not found"; document.getElementById("m").textContent = "Page not found."; return; }
  var extra = parts.filter(Boolean).join("&");
  if (extra) {
    var h = to.indexOf("#"), hash = h < 0 ? "" : to.slice(h), u = h < 0 ? to : to.slice(0, h);
    to = u + (u.indexOf("?") < 0 ? "?" : "&") + extra + hash;
  }
  location.replace(to);
})();
</script>
</body>
</html>
